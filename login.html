<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member Login - The Calcutta Connoisseurs Circle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,500;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- Link to external CSS file -->
<link rel="stylesheet" href="design.css">
</head>
<body class="on-dark">

<header class="site-nav" id="main-nav">
  <div class="nav-row">
    <a href="index.html" class="brand">
      <img src="./WhatsApp Image 2026-07-27 at 10.27.16 AM (1).jpeg" alt="Calcutta Connoisseurs Circle Logo" style="border-radius: 50%; object-fit: cover;">
      <span class="brand-text">
        <span class="name">The Calcutta Connoisseurs Circle</span>
        <span class="sub">Return to Main Table</span>
      </span>
    </a>
  </div>
</header>

<!-- ========================================== -->
<!-- TEMPORARY LAUNCHING SOON LANDING PAGE      -->
<!-- ========================================== -->
<section class="on-dark auth-section reveal" id="temp-launch-page">
  <div class="animate-on-scroll" style="width: 100%; max-width: 600px; margin: 0 auto; text-align: center; display: flex; flex-direction: column; align-items: center;">
    
    <!-- Launching Soon Poster -->
    <img src="TCCC_Launching Soon.jpeg" alt="The Calcutta Connoisseurs Circle - Launching Soon" style="width: 100%; height: auto; border-radius: 8px; box-shadow: 0 20px 40px rgba(0,0,0,0.6);">
    
    <!-- Return Home Button -->
    <div style="margin-top: 40px;">
        <a href="index.html" class="btn btn-ghost">Return Home</a>
    </div>
    
  </div>
</section>

<!-- ========================================== -->
<!-- ORIGINAL LOGIN CODE (HIDDEN TEMPORARILY)   -->
<!-- ========================================== -->
<div style="display: none;" id="original-login-code">
  <section class="on-dark auth-section reveal">
    <div class="auth-box animate-on-scroll">
      <div class="section-head" style="margin-bottom: 32px; text-align: center;">
        <div class="eyebrow on-dark" style="justify-content: center;">Member Portal</div>
        <h2 style="color:var(--ledger-cream); font-size: 28px;">Your table awaits</h2>
        <p style="color:rgba(239,232,216,0.7); font-size: 15px;">Access your digital card, RSVPs, and cellar notes.</p>
      </div>

      <!-- Form now redirects to member-portal.html -->
      <form onsubmit="window.location.href='member-portal.html'; return false;">
        <div class="form-grid">
          <div class="full">
            <label for="login-email">Membership Email or ID</label>
            <input id="login-email" type="email" placeholder="CCC · 2026 · XXXXXX" required>
          </div>
          <div class="full">
            <label for="login-pass">Private Access Key</label>
            <input id="login-pass" type="password" placeholder="••••••••" required>
          </div>
          <div class="full">
            <button type="submit" class="btn btn-primary" style="width: 100%;">Enter Portal</button>
          </div>
        </div>
      </form>

      <div class="auth-links" style="justify-content: flex-end;">
        <a href="#">Forgot Access Key?</a>
      </div>
    </div>
  </section>
</div>
<!-- END OF HIDDEN LOGIN CODE -->

<script src="back.js"></script>
</body>
</html>
